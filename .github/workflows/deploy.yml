# Builds the site and publishes it to GitHub Pages.
#
# The converter libraries in src/assets/vendor are not committed; `npm run build`
# bundles them from node_modules, so the site has to be built here rather than
# served straight from the repository.
#
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check the build
        run: |
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/sitemap.xml
          test -f _site/assets/vendor/ffmpeg/core/ffmpeg-core.wasm
          test -f _site/assets/vendor/heic.js
          echo "Pages: $(find _site -name index.html | wc -l)"
          du -sh _site

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
